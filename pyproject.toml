[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rastrillo"
version = "0.1.0"
description = "Rastrillo: herramienta local y privada que rastrea tu huella digital, encuentra tus cuentas regadas por la web y las borra o anonimiza de un solo pase, dejando solo las que quieres conservar."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.44",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "rich>=13.7",
    "sherlock-project>=0.15.0",
    "holehe>=1.61",
    # anthropic es opcional: solo se usa para el modo IA de respaldo.
    "anthropic>=0.30",
    "reportlab>=4.0",
    # openpyxl: informe XLSX (Paso 6). YA venía instalada como dependencia
    # transitiva de sherlock-project, pero se declara explícitamente: depender
    # por accidente de la dependencia de otro es frágil — el día que Sherlock
    # la quite, Rastrillo se rompe sin haber cambiado nada.
    # OJO: esto NO cambia el pin de requirements.lock (openpyxl==3.1.5). Ver
    # la nota sobre el lock en CLAUDE.md antes de regenerarlo.
    "openpyxl>=3.1",
    # dnspython: única dep del módulo Domain Intelligence. La stdlib no
    # resuelve MX/NS/TXT; ver justificación en rastrillo/domain_intel.py.
    "dnspython>=2.6",
]

[project.scripts]
# El entrypoint vive en cli.py (raíz del repo). Ambos comandos apuntan al
# mismo `main`; `rs` es solo un alias corto para escribir menos.
rastrillo = "cli:main"
rs = "cli:main"

[tool.setuptools]
# El paquete vive en rastrillo/ y cli.py es un módulo suelto en la raíz.
packages = ["rastrillo"]
py-modules = ["cli"]

[tool.setuptools.package-data]
# Tarea 10: el frontend vive en rastrillo/static/ (index.html + styles.css
# + app.js). Sin esta entrada los wheels no llevan los assets y `pip
# install rastrillo` deja el dashboard sin CSS/JS.
rastrillo = ["recipes/*.json", "static/*"]
