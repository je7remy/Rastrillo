name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # NOTA: la suite usa FakePage / servidor HTTP local; no necesita
      # `playwright install chromium`. Si en el futuro algún test arranca
      # un Chromium real, añadir aquí: `python -m playwright install chromium`.
      - name: Run tests
        env:
          # Asegurar que las envs opcionales no estén seteadas: la suite
          # asume sandbox limpio (cada test usa su propio RASTRILLO_HOME).
          ANTHROPIC_API_KEY: ""
          RASTRILLO_HIBP_API_KEY: ""
          RASTRILLO_DRY_RUN: ""
        run: python -m unittest discover -t . -s tests -v

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    # Bloqueante: la primera pasada local sobre `requirements.lock` no
    # encontró CVEs, así que un fallo aquí señala una vulnerabilidad real
    # nueva. Si necesitas degradarlo temporalmente para no bloquear merges,
    # añade `continue-on-error: true` aquí abajo.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit (lockfile)
        # Auditamos `requirements.lock` (versiones fijas, generado con
        # pip-compile). Cuando aparezca un CVE, regenera el lock con
        #   python -m piptools compile pyproject.toml -o requirements.lock
        # y vuelve a empujar.
        run: pip-audit --strict -r requirements.lock
